services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: responsehub
      POSTGRES_PASSWORD: responsehub
      POSTGRES_DB: responsehub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U responsehub"]
      interval: 5s
      retries: 10

  # Local S3-compatible storage for presigned uploads (console on :9001).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
